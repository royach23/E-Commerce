version: '3s'

services:
  app:
    build:
      context: ./client/socks-ecommerce/
      dockerfile: ./Dockerfile
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    expose:
      - 3000

  ecommerce-server:
    build:
      context: ./server/
      dockerfile: ./Dockerfile
    depends_on:
      - db
      - redis
    volumes:
      - ./server/:/app:ro
    env_file:
      - server/.env
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    expose:
      - 8000

  db:
      image: postgres:15-alpine
      volumes:
        - postgres_data:/var/lib/postgresql/data/
      expose:
        - 5432
      environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_DB=ecommerce
  
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"

volumes:
      postgres_data: 